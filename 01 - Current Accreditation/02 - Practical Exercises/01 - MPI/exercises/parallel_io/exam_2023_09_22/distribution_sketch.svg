<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Množenje matrica uz kolektivno čitanje blokova vrsta</title>
  <desc id="desc">P0 čita vrste 0 i 1, P1 čita vrste 2 i 3. P0 šalje B i objavljuje rang P1. P1 prikuplja vrste C od oba procesa.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#405369"/>
    </marker>
  </defs>
  <rect width="1000" height="410" rx="14" fill="#faf8f3"/>
  <g font-family="system-ui, sans-serif" fill="#26364a">
    <text x="30" y="40" font-size="24" font-weight="700">MPI-IO · množenje matrica po blokovima vrsta</text>
    <text x="30" y="74" font-size="16" font-weight="700">1. Čitanje A</text>
    <text x="30" y="99" font-size="13">matA.dat · redosled u fajlu</text>
    <rect x="30" y="110" width="304" height="35" rx="5" fill="#eeeae2"/>
    <text x="42" y="132" font-family="monospace" font-size="13">5 8 1 −1 | 6 9 0 3 | 7 10 2 1</text>
    <text x="38" y="172" font-size="13">vrsta</text>
    <text x="102" y="172" font-family="monospace" font-size="14">0     1     2</text>
    <rect x="84" y="182" width="140" height="54" rx="6" fill="#dceafa"/>
    <rect x="84" y="241" width="140" height="54" rx="6" fill="#dff0dd"/>
    <g font-family="monospace" font-size="15" xml:space="preserve">
      <text x="56" y="204">0</text><text x="102" y="204"> 5     6     7</text>
      <text x="56" y="226">1</text><text x="102" y="226"> 8     9    10</text>
      <text x="56" y="263">2</text><text x="102" y="263"> 1     0     2</text>
      <text x="56" y="285">3</text><text x="102" y="285">−1     3     1</text>
    </g>
    <path d="M232 209 H364 M232 268 H364" stroke="#405369" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="241" y="199" font-size="12">MPI_File_read_all</text>
    <text x="241" y="258" font-size="12">MPI_File_read_all</text>

    <text x="374" y="74" font-size="16" font-weight="700">2. Lokalno množenje</text>
    <text x="374" y="101" font-size="14">B ima vrste [1, 2], [0, 1], [2, 0]</text>
    <text x="374" y="127" font-size="13">MPI_Bcast(B), MCW · P0 → svi</text>
    <rect x="374" y="182" width="235" height="54" rx="6" fill="#dceafa"/>
    <rect x="374" y="241" width="235" height="54" rx="6" fill="#dff0dd"/>
    <text x="385" y="204" font-size="14" font-weight="700">P0 · suma A = 45</text>
    <text x="385" y="225" font-size="13">C[0] = [19, 16] · C[1] = [28, 25]</text>
    <text x="385" y="263" font-size="14" font-weight="700">P1 · suma A = 6</text>
    <text x="385" y="284" font-size="13">C[2] = [5, 2] · C[3] = [1, 1]</text>
    <text x="374" y="321" font-size="13">C[2,0] = 1 × 1 + 0 × 0 + 2 × 2 = 5</text>

    <text x="710" y="74" font-size="16" font-weight="700">3. Sklapanje C na P1</text>
    <text x="710" y="101" font-size="13">MPI_Reduce(MPI_MINLOC), MCW · svi → P0</text>
    <text x="710" y="127" font-size="13">MPI_Bcast(rang = 1), MCW · P0 → svi</text>
    <text x="632" y="173" font-size="13">MPI_Gather, MCW · svi → P1</text>
    <path d="M620 209 H740 M620 268 H740" stroke="#405369" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="750" y="182" width="155" height="54" rx="6" fill="#dceafa"/>
    <rect x="750" y="241" width="155" height="54" rx="6" fill="#dff0dd"/>
    <g font-family="monospace" font-size="15" xml:space="preserve">
      <text x="777" y="204">0     19  16</text>
      <text x="777" y="226">1     28  25</text>
      <text x="777" y="263">2      5   2</text>
      <text x="777" y="285">3      1   1</text>
    </g>
    <text x="750" y="321" font-size="13">Redosled blokova: P0, P1</text>
    <text x="30" y="371" font-size="13">k = 4, m = 3, n = 2, p = 2 · svaki proces čita k/p = 2 vrste</text>
  </g>
</svg>
